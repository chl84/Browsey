[package]
name = "browsey"
version = "1.0.5"
edition = "2021"
license = "MIT"

[features]
# Opt-in candidate only. Never enable in release/install workflows.
native-test = []

[workspace]
members = ["tests/glib-regression"]
default-members = ["."]
exclude = ["vendor/glib", "vendor/unrar-sys"]
resolver = "2"

[workspace.dependencies]
# Both the application and the optimized regression must use the same ABI pin.
gio = "=0.18.4"

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
tauri = { version = "=2.12.0", features = ["protocol-asset"] }
serde = { version = "1.0.228", features = ["derive"] }
chrono = { version = "0.4.44", default-features = false, features = ["clock"] }
dirs-next = "2.0.0"
notify = "8.2.0"
open = "5.3.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["fmt", "env-filter"] }
tracing-appender = "0.2.4"
once_cell = "1.21.3"
serde_json = "1.0.149"
regex = "1.12.3"
sysinfo = "0.39.6"
trash = "5.2.5"
mime_guess = "2.0.5"
mime = "0.3"
shell-words = "1.1.1"
walkdir = "2.5.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate", "aes-crypto"] }
zeroize = "1"
tar = "0.4.46"
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
bzip2 = "0.6.1"
xz2 = "0.1.7"
zstd = "0.14.0"
sevenz-rust2 = { version = "0.23.0", default-features = false, features = ["util", "aes256", "bzip2", "deflate", "lz4", "zstd", "brotli", "ppmd"] }
rayon = "1.11.0"
libc = "0.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "pnm", "tga", "webp", "tiff", "hdr", "dds", "exr"] }
jpeg-decoder = "0.3.2"
blake3 = "1.8.3"
num_cpus = "1.17.0"
tokio = { version = "1.53.1", default-features = false, features = ["sync", "fs", "io-util", "time"] }
resvg = "0.48.1"
# Pin both the wrapper and its supported ABI; the bundled binary is verified
# against this profile by the PDF regression tests (see resources/pdfium.json).
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_7881", "thread_safe", "image_025"] }
which = "8.0.0"
url = "2.5.8"
# Used lazily by Google Drive ID mutations; no client on ordinary filesystem routes.
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "query", "native-tls"] }
unrar_sys = "=0.5.8"
wait-timeout = "0.2.1"

[dev-dependencies]
sevenz-rust2 = { version = "0.23.0", default-features = false, features = ["compress"] }

[patch.crates-io]
# Keep Tauri's GTK3 ABI while backporting the upstream mutable out-pointer fix.
glib = { path = "vendor/glib" }
unrar_sys = { path = "vendor/unrar-sys" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_WindowsProgramming", "Win32_NetworkManagement_WNet", "Win32_Devices_DeviceAndDriverInstallation", "Win32_System_Ioctl", "Win32_System_IO", "Win32_Security", "Win32_Security_Authorization"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Memory", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
winreg = "0.55.0"

[target.'cfg(not(target_os = "windows"))'.dependencies]
# Already used by Tauri/GTK; direct access avoids short-lived CLI D-Bus calls.
gio.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"

[target.'cfg(target_os = "linux")'.dev-dependencies]
webkit2gtk = "=2.0.2"

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.image-webp]
opt-level = 3

[profile.dev.package.tao]
# tao emits noisy debug-only keyboard conversion logs on Linux for media/unknown keys.
# Disable tao debug assertions in dev profile to keep terminal output usable.
debug-assertions = false
