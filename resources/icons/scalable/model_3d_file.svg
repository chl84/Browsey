<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" role="img" aria-label="3D model file icon">
  <g>
    <!-- Same document and folded corner as the generic file icon. -->
    <path d="M28 14H76L100 38V114H28V14Z" fill="#ececee" data-icon-fill="paper" stroke="#1f232b" data-icon-stroke="ink" stroke-width="2" stroke-linejoin="miter" />
    <path d="M76 14v24h24" fill="#d3d4d7" data-icon-fill="fold" stroke="#1f232b" data-icon-stroke="ink" stroke-width="2" stroke-linejoin="miter" />

    <!-- Three shaded faces make the model symbol readable at small sizes. -->
    <g stroke="#1f232b" data-icon-stroke="ink" stroke-width="3" stroke-linejoin="miter">
      <path d="M64 54 90 68 64 82 38 68Z" fill="#cdd7e2" data-icon-fill="blue" />
      <path d="M38 68 64 82V106L38 92Z" fill="#b6c7d9" data-icon-fill="blue-mid" />
      <path d="M64 82 90 68V92L64 106Z" fill="#a2b8d2" data-icon-fill="blue-strong" />
    </g>
  </g>
</svg>
