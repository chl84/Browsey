<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Hard disk icon">
  <g transform="translate(0 4)">
    <!-- Back plate -->
    <rect x="8" y="20" width="112" height="80" rx="0" fill="#9772b2" data-icon-fill="disk"></rect>

    <!-- Top edge / depth -->
    <rect x="8" y="20" width="112" height="20" rx="0" fill="#7f6096" data-icon-fill="disk-tab"></rect>

    <!-- Disk platter -->
    <circle cx="64" cy="64" r="22" fill="#171717" data-icon-fill="disk-detail"></circle>

    <!-- Center hub -->
    <circle cx="64" cy="64" r="6" fill="#9772b2" data-icon-fill="disk"></circle>

    <!-- Status lamp -->
    <circle cx="96" cy="84" r="4" fill="#7d6093" data-icon-fill="disk-inset"></circle>
  </g>
</svg>
