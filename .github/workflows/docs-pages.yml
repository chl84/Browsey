name: Docs Pages

on:
  push:
    branches: ["main"]
  pull_request:
    paths:
      - "docs-site/**"
      - "frontend/src/features/settings/settingsTypes.ts"
      - "Cargo.toml"
      - "CHANGELOG.md"
      - "docs/installation.md"
      - "docs/usage.md"
      - "docs/development.md"
      - "docs/architecture/**"
      - "scripts/maintenance/check-docs-consistency.sh"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: "pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Compute Pages base path
        run: |
          if [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            echo "PAGES_BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "PAGES_BASE_PATH=/${{ github.event.repository.name }}/" >> "$GITHUB_ENV"
          fi

      - name: Install docs dependencies
        run: npm --prefix docs-site ci

      - name: Lint docs
        run: npm --prefix docs-site run lint

      - name: Check docs
        run: npm --prefix docs-site run check

      - name: Test docs routes, search and content
        run: npm --prefix docs-site test

      - name: Check documentation consistency
        run: bash scripts/maintenance/check-docs-consistency.sh --strict

      - name: Build docs
        run: npm --prefix docs-site run build

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
