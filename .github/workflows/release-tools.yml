name: Release Tools

on:
  pull_request:
    paths:
      - 'scripts/release/**'
      - 'scripts/maintenance/test-both.sh'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'packaging/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs-site/src/content/pages.ts'
      - 'tauri.conf.json'
      - '.github/workflows/release-tools.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/release/**'
      - 'scripts/maintenance/test-both.sh'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'packaging/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs-site/src/content/pages.ts'
      - 'tauri.conf.json'
      - '.github/workflows/release-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test preview, bump and safety guards in isolated repositories
        run: node --test scripts/release/bump.test.mjs
