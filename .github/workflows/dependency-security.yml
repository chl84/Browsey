name: Dependency Security

on:
  # Required branch checks must report a result for every pull request.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'frontend/package*.json'
      - 'docs-site/package*.json'
      - '.cargo/audit.toml'
      - 'vendor/**'
      - 'resources/glib-*'
      - 'resources/unrar-*'
      - 'THIRD_PARTY_NOTICES'
      - 'scripts/maintenance/check-vendor.mjs'
      - 'scripts/maintenance/check-dependency-policy*.mjs'
      - '.github/workflows/dependency-security.yml'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned advisory checker
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Rust security advisories
        run: cargo audit

  npm:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [frontend, docs-site]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify vendored source and backports
        run: node scripts/maintenance/check-vendor.mjs
      - name: Verify coordinated desktop dependency policy
        run: |
          node --test scripts/maintenance/check-dependency-policy.test.mjs
          node scripts/maintenance/check-dependency-policy.mjs
      - name: npm security advisories
        run: npm --prefix "${{ matrix.project }}" audit --audit-level=moderate
