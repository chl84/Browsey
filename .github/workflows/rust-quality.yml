name: Rust Quality

on:
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'vendor/**'
      - 'resources/glib-*'
      - 'resources/unrar-*'
      - 'scripts/maintenance/check-vendor.mjs'
      - 'scripts/maintenance/check-dependency-policy*.mjs'
      - 'build.rs'
      - 'resources/pdfium*'
      - 'resources/pdfium*/**'
      - 'tests/fixtures/pdf/**'
      - 'THIRD_PARTY_NOTICES'
      - 'scripts/maintenance/check-pdfium.mjs'
      - '.github/workflows/rust-quality.yml'
      - 'scripts/maintenance/check-backend-error-hardening-guard.sh'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'vendor/**'
      - 'resources/glib-*'
      - 'resources/unrar-*'
      - 'scripts/maintenance/check-vendor.mjs'
      - 'scripts/maintenance/check-dependency-policy*.mjs'
      - 'build.rs'
      - 'resources/pdfium*'
      - 'resources/pdfium*/**'
      - 'tests/fixtures/pdf/**'
      - 'THIRD_PARTY_NOTICES'
      - 'scripts/maintenance/check-pdfium.mjs'
      - '.github/workflows/rust-quality.yml'
      - 'scripts/maintenance/check-backend-error-hardening-guard.sh'
  workflow_dispatch:

jobs:
  rust-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies (Tauri/GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev
          sudo apt-get install -y libdbus-1-dev dbus-x11 xvfb libxtst6 fonts-dejavu-core

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify bundled PDFium provenance and checksums
        run: node scripts/maintenance/check-pdfium.mjs

      - name: Verify local backports and coordinated dependency pins
        run: |
          node scripts/maintenance/check-vendor.mjs
          node --test scripts/maintenance/check-dependency-policy.test.mjs
          node scripts/maintenance/check-dependency-policy.mjs

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Install Semgrep
        run: python3 -m pip install --upgrade semgrep

      - name: "Semgrep Typed-Error Seams (advisory)"
        continue-on-error: true
        run: semgrep --config .semgrep/typed-errors.yml src

      - name: "Semgrep Typed-Error Seams (blocking: commands-first)"
        run: semgrep --config .semgrep/typed-errors-blocking.yml src/commands

      - name: Backend Error Hardening Guard
        run: bash scripts/maintenance/check-backend-error-hardening-guard.sh

      - name: Tests
        run: cargo test --all-targets --all-features

      - name: Native WebKit drag and window teardown
        run: |
          GDK_BACKEND=x11 WEBKIT_DISABLE_DMABUF_RENDERER=1 \
            timeout --signal=TERM --kill-after=3s 60s \
            dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' \
            cargo test --locked webkit_file_export_and_window_teardown -- --ignored --test-threads=1 --nocapture

      - name: Optimized GLib backport regression
        run: cargo test --locked --release glib_variant_string_iterator_out_pointer_is_mutable
